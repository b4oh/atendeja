<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AtendeJá — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(0,179,126,0.22), transparent 30%),
                linear-gradient(135deg, #0F2D45 0%, #123A5A 52%, #0B1F31 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 36px;
            font-weight: 800;
            color: #1A3C5E;
        }
        .logo h1 span { color: #00B37E; }
        .logo p {
            color: #7A8694;
            font-size: 14px;
            margin-top: 4px;
        }
        .alert-error {
            background: #FEE2E2;
            border: 1px solid #FCA5A5;
            color: #991B1B;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-success {
            background: #D1FAE5;
            border: 1px solid #6EE7B7;
            color: #065F46;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #7A8694; font-size: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1.5px solid #D1D5DB;
            border-radius: 8px;
            font-size: 15px;
            color: #1F2937;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #00B37E;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #00B37E;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover { background: #00875A; }
        .links {
            text-align: center;
            margin-top: 24px;
        }
        .links a {
            color: #00B37E;
            text-decoration: none;
            font-size: 14px;
        }
        .sus-badge {
            text-align: center;
            margin-top: 24px;
            color: #9CA3AF;
            font-size: 12px;
        }
        @media (max-width: 520px) {
            .login-card { padding: 36px 24px; }
            .logo h1 { font-size: 32px; }
        }
    </style>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
    <link rel="stylesheet" class="app-global-style" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <h1>Atende<span>Já</span></h1>
        <p>Sistema de Filas do SUS — Alagoas</p>
    </div>

    <!-- Mensagem de erro -->
    <div class="alert-error" th:if="${param.error}">
        E-mail ou senha incorretos. Tente novamente.
    </div>

    <!-- Mensagem de logout -->
    <div class="alert-success" th:if="${param.logout}">
        Você saiu do sistema com sucesso.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">E-mail</label>
            <div class="input-wrap">
                <i class="bi bi-envelope"></i>
                <input type="email"
                       id="username"
                       name="username"
                       placeholder="seu@email.com"
                       required
                       autofocus/>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <div class="input-wrap">
                <i class="bi bi-lock"></i>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="••••••••"
                       required/>
            </div>
        </div>

        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right"></i>
            Entrar no sistema
        </button>
    </form>

    <div class="links">
        <a th:href="@{/cadastro}">Criar conta para agendar exames</a>
        <br/><br/>
        <a th:href="@{/senha/consultar}" style="color:#7A8694;">
            Consultar posição na fila (sem login)
        </a>
    </div>

    <div class="sus-badge">
        Secretaria de Estado da Saúde de Alagoas
    </div>
</div>
</body>
</html>
