<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>AtendeJá — Agendar Exame</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0F2D45, #0A1A28);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px 20px;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 36px; font-weight: 800; color: #fff; }
        .logo h1 span { color: #00B37E; }
        .logo p { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 4px; }
        .subtitle { color: rgba(255,255,255,0.7); font-size: 18px; margin-bottom: 24px; }
        .unidades { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 560px; width: 100%; }
        .unidade-btn {
            background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 28px 20px; text-align: center;
            color: #fff; text-decoration: none; transition: all 0.25s;
        }
        .unidade-btn:hover { background: rgba(0,179,126,0.15); border-color: #00B37E; transform: translateY(-2px); }
        .unidade-btn .icon {
            width: 52px; height: 52px; margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; background: rgba(0,179,126,0.14);
            border: 1px solid rgba(0,179,126,0.32);
            color: #00B37E; font-size: 24px; font-weight: 800; letter-spacing: 0;
        }
        .unidade-btn .nome { font-size: 15px; font-weight: 700; display: block; }
        .unidade-btn .tipo { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; display: block; }
        .btn-voltar { display: inline-block; margin-top: 24px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; }
        .btn-voltar:hover { color: #00B37E; }
    </style>
    <link rel="stylesheet" class="app-global-style" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="logo">
    <h1>Atende<span>Já</span></h1>
    <p>Agendamento de Exames</p>
</div>

<p class="subtitle">Selecione a unidade de saúde</p>

<div class="unidades">
    <a class="unidade-btn" th:each="u : ${unidades}"
       th:href="@{/agendamento/novo/{id}(id=${u.id})}">
            <span class="icon">
                <i class="bi"
                   th:classappend="${u.tipo.name() == 'UPA' ? ' bi-heart-pulse' : u.tipo.name() == 'HOSPITAL' ? ' bi-hospital' : ' bi-building'}"></i>
            </span>
        <span class="nome" th:text="${u.nome}"></span>
        <span class="tipo" th:text="${u.tipo}"></span>
    </a>
</div>

<a class="btn-voltar" th:href="@{/agendamento}">← Voltar</a>
</body>
</html>
