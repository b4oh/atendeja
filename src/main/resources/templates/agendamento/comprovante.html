<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>AtendeJá — Agendamento Confirmado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0F2D45, #0A1A28);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px 20px;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 36px; font-weight: 800; color: #fff; }
        .logo h1 span { color: #00B37E; }
        .check-icon { font-size: 48px; margin-bottom: 16px; text-align: center; }
        .sucesso-msg { color: #00B37E; font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .sucesso-sub { color: rgba(255,255,255,0.5); font-size: 14px; text-align: center; margin-bottom: 32px; }
        .comprovante {
            background: #fff; border-radius: 16px; padding: 40px;
            max-width: 420px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .comprovante .header-comp {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 16px;
            border-bottom: 2px dashed #E5E7EB;
        }
        .comprovante .brand { font-size: 18px; font-weight: 800; color: #1A3C5E; }
        .comprovante .brand span { color: #00B37E; }
        .comprovante .data { font-size: 12px; color: #9CA3AF; }
        .comprovante .label { font-size: 12px; color: #9CA3AF; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
        .comprovante .exame-nome { font-size: 24px; font-weight: 800; color: #1A3C5E; }
        .comprovante .unidade-nome { font-size: 14px; color: #7A8694; margin-top: 4px; }
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0;
            margin-top: 20px; border-top: 1px solid #F3F4F6;
        }
        .info-item {
            padding: 16px 12px; text-align: center;
            border-bottom: 1px solid #F3F4F6;
        }
        .info-item:nth-child(odd) { border-right: 1px solid #F3F4F6; }
        .info-item .val { font-size: 22px; font-weight: 800; color: #1A3C5E; }
        .info-item .lbl { font-size: 11px; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
        .status-badge {
            display: inline-block; margin-top: 16px; padding: 6px 16px;
            background: #DBEAFE; color: #1E40AF; border-radius: 8px;
            font-size: 14px; font-weight: 700;
        }
        .actions { margin-top: 32px; display: flex; gap: 12px; width: 100%; max-width: 420px; }
        .btn {
            flex: 1; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700;
            cursor: pointer; text-decoration: none; text-align: center; border: none;
        }
        .btn-meus { background: #1A3C5E; color: #fff; }
        .btn-meus:hover { background: #122e4a; }
        .btn-novo { background: rgba(255,255,255,0.1); color: #fff; border: 1.5px solid rgba(255,255,255,0.2); }
        .btn-novo:hover { border-color: #00B37E; color: #00B37E; }
    </style>
    <link rel="stylesheet" class="app-global-style" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="logo">
    <h1>Atende<span>Já</span></h1>
</div>

<div class="check-icon">✅</div>
<p class="sucesso-msg">Agendamento confirmado!</p>
<p class="sucesso-sub">Compareça na unidade na data e horário informados</p>

<div class="comprovante" th:if="${agendamento != null}">
    <div class="header-comp">
        <div class="brand">Atende<span>Já</span></div>
        <div class="data" th:text="${#temporals.format(agendamento.criadoEm, 'dd/MM/yyyy HH:mm')}"></div>
    </div>

    <div class="label">EXAME AGENDADO</div>
    <div class="exame-nome" th:text="${agendamento.tipoExame.nome}"></div>
    <div class="unidade-nome" th:text="${agendamento.unidade.nome}"></div>

    <div class="info-grid">
        <div class="info-item">
            <div class="val" th:text="${#temporals.format(agendamento.dataExame, 'dd/MM/yyyy')}"></div>
            <div class="lbl">Data</div>
        </div>
        <div class="info-item">
            <div class="val" th:text="${agendamento.horaExame}"></div>
            <div class="lbl">Horário</div>
        </div>
    </div>

    <span class="status-badge" th:text="${agendamento.status}"></span>
</div>

<div class="actions">
    <a class="btn btn-meus" th:href="@{/agendamento}">Meus Agendamentos</a>
    <a class="btn btn-novo" th:href="@{/agendamento/novo}">Novo Agendamento</a>
</div>
</body>
</html>
