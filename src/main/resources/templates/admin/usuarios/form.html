<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>AtendeJá — Usuário</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #F4F6F9; }
        .header {
            background: #1A3C5E; padding: 16px 32px;
            display: flex; align-items: center; justify-content: space-between; color: #fff;
        }
        .header h1 { font-size: 22px; }
        .header h1 span { color: #00B37E; }
        .header-links a { color: #fff; text-decoration: none; font-size: 14px; margin-left: 16px;
            background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 8px; }
        .content { padding: 32px; max-width: 700px; margin: 0 auto; }
        .page-title { margin-bottom: 24px; }
        .page-title h2 { font-size: 24px; color: #1A3C5E; }
        .page-title p { color: #7A8694; font-size: 14px; margin-top: 4px; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .alert-error { background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; }
        .card {
            background: #fff; border-radius: 12px; padding: 32px;
            border: 1px solid #E5E7EB; box-shadow: 0 8px 24px rgba(15,45,69,0.08);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 13px; font-weight: 600; color: #374151;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            padding: 10px 14px; border: 1.5px solid #D1D5DB; border-radius: 8px;
            font-size: 14px; color: #1F2937; outline: none; transition: border-color 0.2s;
            font-family: 'Segoe UI', sans-serif; background: #fff;
        }
        .form-group input:focus, .form-group select:focus { border-color: #00B37E; }
        .checkbox-group {
            display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
        }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-group label { font-size: 14px; color: #374151; cursor: pointer; }
        .form-actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; border: none; text-decoration: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: #00B37E; color: #fff; flex: 1; }
        .btn-primary:hover { background: #00875A; }
        .btn-cancel { background: #F3F4F6; color: #374151; border: 1px solid #D1D5DB; }
        .btn-cancel:hover { background: #E5E7EB; }
        .hint { font-size: 12px; color: #9CA3AF; margin-top: 2px; }
        @media (max-width: 760px) {
            .form-row { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
        }
    </style>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
    <link rel="stylesheet" class="app-global-style" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="header">
    <h1>Atende<span>Já</span></h1>
    <div class="header-links">
        <a th:href="@{/admin/usuarios}"><i class="bi bi-arrow-left"></i> Voltar</a>
        <form th:action="@{/logout}" method="post" style="display:inline;margin:0;">
            <button type="submit" style="background:rgba(255,255,255,0.15);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer;">Sair</button>
        </form>
    </div>
</div>

<div class="content">
    <div class="page-title">
        <h2 th:text="${usuario != null ? 'Editar Usuário' : 'Novo Usuário'}"></h2>
        <p th:text="${usuario != null ? 'Atualize os dados do usuário' : 'Preencha os dados para cadastrar'}"></p>
    </div>

    <!-- Alerta de erro -->
    <div class="alert alert-error" th:if="${erro}" th:text="${erro}"></div>

    <!-- Formulário de NOVO usuário -->
    <div class="card" th:if="${usuario == null}">
        <form th:action="@{/admin/usuarios/salvar}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: Maria Alves"/>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" required placeholder="Somente números"
                           maxlength="11" pattern="[0-9]{11}" title="Digite 11 números"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="email@exemplo.com"/>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Mínimo 6 caracteres"
                           minlength="6"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="perfil">Perfil de acesso</label>
                    <select id="perfil" name="perfil" required>
                        <option value="">Selecione...</option>
                        <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="unidadeId">Unidade vinculada</label>
                    <select id="unidadeId" name="unidadeId">
                        <option value="">Nenhuma (Admin / Cidadão)</option>
                        <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.nome}"></option>
                    </select>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="ativo" name="ativo" value="true" checked/>
                <label for="ativo">Usuário ativo (pode fazer login)</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Cadastrar Usuário</button>
                <a class="btn btn-cancel" th:href="@{/admin/usuarios}"><i class="bi bi-x-circle"></i> Cancelar</a>
            </div>
        </form>
    </div>

    <!-- Formulário de EDIÇÃO -->
    <div class="card" th:if="${usuario != null}">
        <form th:action="@{/admin/usuarios/atualizar/{id}(id=${usuario.id})}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required th:value="${usuario.nome}"/>
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" th:value="${usuario.cpf}" disabled
                           style="background:#F3F4F6;color:#9CA3AF;"/>
                    <span class="hint">CPF não pode ser alterado</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required th:value="${usuario.email}"/>
                </div>
                <div class="form-group">
                    <label for="senha">Nova senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Deixe vazio para manter"
                           minlength="6"/>
                    <span class="hint">Preencha apenas se quiser trocar a senha</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="perfil">Perfil de acesso</label>
                    <select id="perfil" name="perfil" required>
                        <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"
                                th:selected="${p == usuario.perfil}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="unidadeId">Unidade vinculada</label>
                    <select id="unidadeId" name="unidadeId">
                        <option value="">Nenhuma (Admin / Cidadão)</option>
                        <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.nome}"
                                th:selected="${usuario.unidade != null && u.id == usuario.unidade.id}"></option>
                    </select>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="ativo" name="ativo" value="true"
                       th:checked="${usuario.ativo}"/>
                <label for="ativo">Usuário ativo (pode fazer login)</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Salvar Alterações</button>
                <a class="btn btn-cancel" th:href="@{/admin/usuarios}"><i class="bi bi-x-circle"></i> Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
