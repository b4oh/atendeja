<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>AtendeJá — Unidade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #F4F6F9; }
        .header {
            background: #1A3C5E; padding: 16px 32px;
            display: flex; align-items: center; justify-content: space-between; color: #fff;
        }
        .header h1 { font-size: 22px; }
        .header h1 span { color: #00B37E; }
        .header-links a { color: #fff; text-decoration: none; font-size: 14px; margin-left: 16px;
            background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 8px; }
        .content { padding: 32px; max-width: 700px; margin: 0 auto; }
        .page-title { margin-bottom: 24px; }
        .page-title h2 { font-size: 24px; color: #1A3C5E; }
        .page-title p { color: #7A8694; font-size: 14px; margin-top: 4px; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .alert-error { background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; }
        .card {
            background: #fff; border-radius: 12px; padding: 32px;
            border: 1px solid #E5E7EB; box-shadow: 0 8px 24px rgba(15,45,69,0.08);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 13px; font-weight: 600; color: #374151;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            padding: 10px 14px; border: 1.5px solid #D1D5DB; border-radius: 8px;
            font-size: 14px; color: #1F2937; outline: none; transition: border-color 0.2s;
            font-family: 'Segoe UI', sans-serif; background: #fff;
        }
        .form-group input:focus, .form-group select:focus { border-color: #00B37E; }
        .checkbox-group {
            display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
        }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-group label { font-size: 14px; color: #374151; cursor: pointer; }
        .form-actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; border: none; text-decoration: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: #00B37E; color: #fff; flex: 1; }
        .btn-primary:hover { background: #00875A; }
        .btn-cancel { background: #F3F4F6; color: #374151; border: 1px solid #D1D5DB; }
        .btn-cancel:hover { background: #E5E7EB; }
        @media (max-width: 760px) {
            .form-row { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
        }
    </style>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
    <link rel="stylesheet" class="app-global-style" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="header">
    <h1>Atende<span>Já</span></h1>
    <div class="header-links">
        <a th:href="@{/admin/unidades}"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
</div>

<div class="content">
    <div class="page-title">
        <h2 th:text="${unidade != null ? 'Editar Unidade' : 'Nova Unidade de Saúde'}"></h2>
        <p th:text="${unidade != null ? 'Atualize os dados da unidade' : 'Preencha os dados para cadastrar'}"></p>
    </div>

    <div class="alert alert-error" th:if="${erro}" th:text="${erro}"></div>

    <!-- Formulário NOVO -->
    <div class="card" th:if="${unidade == null}">
        <form th:action="@{/admin/unidades/salvar}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome da unidade</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: UBS Tabuleiro do Martins"/>
                </div>
                <div class="form-group">
                    <label for="cnes">CNES</label>
                    <input type="text" id="cnes" name="cnes" required placeholder="7 dígitos"
                           maxlength="7" pattern="[0-9]{7}" title="Digite 7 números"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecione...</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" placeholder="(82) 3315-0000"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" required
                           placeholder="Rua, número, bairro — Maceió/AL"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full">
                    <label for="horario">Horário de funcionamento</label>
                    <input type="text" id="horario" name="horario" placeholder="Ex: Seg-Sex 07h-17h"/>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="ativa" name="ativa" value="true" checked/>
                <label for="ativa">Unidade ativa (emite senhas)</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Cadastrar Unidade</button>
                <a class="btn btn-cancel" th:href="@{/admin/unidades}"><i class="bi bi-x-circle"></i> Cancelar</a>
            </div>
        </form>
    </div>

    <!-- Formulário EDIÇÃO -->
    <div class="card" th:if="${unidade != null}">
        <form th:action="@{/admin/unidades/atualizar/{id}(id=${unidade.id})}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome da unidade</label>
                    <input type="text" id="nome" name="nome" required th:value="${unidade.nome}"/>
                </div>
                <div class="form-group">
                    <label>CNES</label>
                    <input type="text" th:value="${unidade.cnes}" disabled
                           style="background:#F3F4F6;color:#9CA3AF;"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" name="tipo" required>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"
                                th:selected="${t == unidade.tipo}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" th:value="${unidade.telefone}"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" required th:value="${unidade.endereco}"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full">
                    <label for="horario">Horário de funcionamento</label>
                    <input type="text" id="horario" name="horario" th:value="${unidade.horario}"/>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="ativa" name="ativa" value="true"
                       th:checked="${unidade.ativa}"/>
                <label for="ativa">Unidade ativa (emite senhas)</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Salvar Alterações</button>
                <a class="btn btn-cancel" th:href="@{/admin/unidades}"><i class="bi bi-x-circle"></i> Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
