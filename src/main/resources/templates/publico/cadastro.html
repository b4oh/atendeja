<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>AtendeJá — Criar Conta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0F1923;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: #fff; border-radius: 16px; padding: 48px 40px;
            width: 100%; max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 36px; font-weight: 800; color: #1A3C5E; }
        .logo h1 span { color: #00B37E; }
        .logo p { color: #7A8694; font-size: 14px; margin-top: 4px; }
        .alert {
            padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;
        }
        .alert-error { background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 600; color: #374151;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1.5px solid #D1D5DB;
            border-radius: 8px; font-size: 15px; color: #1F2937; outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #00B37E; }
        .hint { font-size: 12px; color: #9CA3AF; margin-top: 4px; }
        .btn-cadastrar {
            width: 100%; padding: 14px; background: #00B37E; color: #fff; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
            margin-top: 8px;
        }
        .btn-cadastrar:hover { background: #00875A; }
        .links { text-align: center; margin-top: 24px; }
        .links a { color: #00B37E; text-decoration: none; font-size: 14px; }
        .links a:hover { text-decoration: underline; }
        .sus-badge { text-align: center; margin-top: 24px; color: #9CA3AF; font-size: 12px; }
    </style>
    <link rel="stylesheet" class="app-global-style" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>Atende<span>Já</span></h1>
        <p>Crie sua conta para agendar exames</p>
    </div>

    <div class="alert alert-error" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="@{/cadastro}" method="post">
        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required
                   placeholder="Seu nome completo" th:value="${nome}"/>
        </div>

        <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" required
                   placeholder="Somente números" maxlength="11"
                   pattern="[0-9]{11}" title="Digite 11 números"
                   th:value="${cpf}"/>
            <p class="hint">Digite apenas os 11 números, sem pontos ou traços</p>
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required
                   placeholder="seu@email.com" th:value="${email}"/>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required
                   placeholder="Mínimo 6 caracteres" minlength="6"/>
        </div>

        <button type="submit" class="btn-cadastrar">Criar minha conta</button>
    </form>

    <div class="links">
        <a th:href="@{/login}">Já tenho conta — fazer login</a>
    </div>

    <div class="sus-badge">
        Secretaria de Estado da Saúde de Alagoas
    </div>
</div>
</body>
</html>
