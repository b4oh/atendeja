<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>AtendeJá — Painel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #060D13; min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px 20px;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 36px; font-weight: 800; color: #fff; }
        .logo h1 span { color: #00B37E; }
        .logo p { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 4px; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 18px; margin-bottom: 24px; }
        .unidades { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 560px; width: 100%; }
        .unidade-btn {
            background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 28px 20px; text-align: center;
            color: #fff; text-decoration: none; transition: all 0.25s;
        }
        .unidade-btn:hover { background: rgba(0,179,126,0.15); border-color: #00B37E; transform: translateY(-2px); }
        .unidade-btn .icon {
            width: 52px; height: 52px; margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; background: rgba(0,179,126,0.14);
            border: 1px solid rgba(0,179,126,0.32);
            color: #00B37E; font-size: 13px; font-weight: 800; letter-spacing: 0.06em;
        }
        .unidade-btn .nome { font-size: 15px; font-weight: 700; display: block; }
        .unidade-btn .tipo { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; display: block; }
        .hint { color: rgba(255,255,255,0.3); font-size: 13px; margin-top: 24px; text-align: center; }
    </style>
    <link rel="stylesheet" class="app-global-style" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="logo">
    <h1>Atende<span>Já</span></h1>
    <p>Painel de Chamada de Senhas</p>
</div>

<p class="subtitle">Selecione a unidade para exibir no painel</p>

<div class="unidades">
    <a class="unidade-btn" th:each="u : ${unidades}"
       th:href="@{/painel/{id}(id=${u.id})}">
            <span class="icon" th:text="${u.tipo}"></span>
        <span class="nome" th:text="${u.nome}"></span>
        <span class="tipo" th:text="${u.tipo}"></span>
    </a>
</div>

<p class="hint">Abra esta página na TV em tela cheia (F11)</p>
</body>
</html>
